[build]
  base = "Fungi.Diet"
  publish = "Fungi.Diet/dist"
  command = "npm run build"

[[forms]]
  name = "commission-request"

[form]
  name = "commission-request"
  action = "/commission"
  method = "POST"
  
[[form.fields]]
  name = "name"
  type = "text"
  required = true

[[form.fields]]
  name = "email"
  type = "email"
  required = true

[[form.fields]]
  name = "phone"
  type = "tel"

[[form.fields]]
  name = "project-type"
  type = "select"
  required = true

[[form.fields]]
  name = "description"
  type = "textarea"
  required = true

[[form.fields]]
  name = "budget"
  type = "text"

[[form.fields]]
  name = "timeline"
  type = "text"

[[form.fields]]
  name = "style-preferences"
  type = "textarea"

[[form.fields]]
  name = "inspiration"
  type = "file"

[[form.fields]]
  name = "additional-info"
  type = "textarea" 